<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>一页纸 · 日程规划器</title>
<style>
  :root {
    --bg: #FBF8F3;
    --bg-card: #FFFFFF;
    --bg-info: #F5F1EA;
    --bg-soft: #F3EFE7;
    --bg-hover: #F0EBE2;
    --bg-today: #FBF4E4;
    --bg-weekend: #FAF6EE;
    --border: #E8E2D6;
    --border-soft: #EFEAE0;
    --border-strong: #C8C0B0;
    --text: #2C2A26;
    --text-secondary: #6B6864;
    --text-muted: #A09A8E;
    --text-faint: #BFB9AC;
    --accent: #E74C3C;
    --accent-soft: #FADBD8;
    --accent-dark: #C0392B;
    --info-accent: #5C7A8C;
    --info-bg: #E9EEF1;
    --gold: #C9A55A;
    --gold-dark: #B8932E;
    --gold-soft: #F4ECD4;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 28px rgba(0,0,0,0.08);
    --font-serif: Georgia, "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --radius: 4px;
    --radius-lg: 8px;
    --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
  *::-webkit-scrollbar-track { background: transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font-serif);
    color: var(--text);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea { font-family: inherit; color: inherit; border: none; outline: none; background: none; }

  /* APP LAYOUT */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* HEADER */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0 14px;
    gap: 16px;
    border-bottom: 1px solid var(--border-soft);
  }

  .brand { display: flex; align-items: baseline; gap: 10px; flex: 0 0 auto; }
  .brand-title { font-size: 22px; font-weight: 600; letter-spacing: 1px; color: var(--text); }
  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: var(--font-sans);
  }

  .view-tabs {
    display: flex;
    gap: 2px;
    background: var(--bg-soft);
    padding: 3px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
  }

  .view-tab {
    padding: 6px 18px;
    font-size: 13px;
    color: var(--text-secondary);
    border-radius: 999px;
    transition: var(--transition);
    font-family: var(--font-serif);
    letter-spacing: 2px;
  }

  .view-tab:hover { color: var(--text); }
  .view-tab.active {
    background: var(--bg-card);
    color: var(--text);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 1 auto;
    justify-content: flex-end;
  }

  .date-display {
    font-size: 15px;
    color: var(--text);
    padding: 6px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: var(--transition);
    min-width: 160px;
    text-align: center;
    user-select: none;
    letter-spacing: 0.5px;
  }

  .date-display:hover { background: var(--bg-hover); }

  .nav-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: var(--text-secondary);
    transition: var(--transition);
    border: 1px solid transparent;
  }

  .nav-btn:hover { background: var(--bg-hover); color: var(--text); }

  .today-btn {
    font-size: 12px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-secondary);
    transition: var(--transition);
    letter-spacing: 1px;
  }

  .today-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* MAIN */
  .app-layout {
    flex: 1 1 auto;
    display: flex;
    gap: 16px;
    min-height: 0;
    overflow: hidden;
  }

  main.main-content {
    flex: 1 1 auto;
    overflow: hidden;
    padding: 16px 0 20px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* SIDEBAR */
  .important-sidebar {
    flex: 0 0 220px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: flex-basis 240ms ease;
  }

  .important-sidebar.collapsed {
    flex: 0 0 44px;
  }

  .important-sidebar.collapsed .sidebar-header h3,
  .important-sidebar.collapsed .sidebar-list,
  .important-sidebar.collapsed .sidebar-empty {
    display: none;
  }

  .important-sidebar.collapsed .sidebar-header {
    padding: 14px 10px;
    justify-content: center;
  }

  .sidebar-toggle {
    margin-left: 4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: var(--transition);
  }
  .sidebar-toggle:hover {
    background: var(--bg-card);
    border-color: var(--text-secondary);
    color: var(--text);
  }

  .sidebar-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg-info);
  }

  .sidebar-header h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-family: var(--font-serif);
  }

  .sidebar-header .star { color: var(--gold); font-size: 14px; }

  .btn-add-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--text);
    color: var(--bg);
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
  }
  .btn-add-icon:hover { background: var(--accent); transform: scale(1.1); }

  /* 任务六: 侧边栏导入/导出/查看工具栏 */
  .sidebar-actions {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg-soft);
  }

  .sidebar-action-btn {
    flex: 1 1 0;
    min-width: 0;
    padding: 5px 4px;
    font-size: 11px;
    letter-spacing: 1px;
    font-family: var(--font-sans);
    color: var(--text-secondary);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: var(--transition);
  }

  .sidebar-action-btn:hover {
    color: var(--text);
    border-color: var(--text-secondary);
    background: var(--bg-hover);
  }

  /* 任务七: 存储将满告警 */
  .storage-warning {
    padding: 8px 10px;
    margin: 6px 8px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--accent-dark, #C0392B);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
  }

  .sidebar-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px;
    min-height: 0;
  }

  .sidebar-empty {
    color: var(--text-faint);
    font-style: italic;
    text-align: center;
    padding: 30px 10px;
    font-size: 12px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--bg-soft);
    border-radius: var(--radius);
    margin-bottom: 5px;
    transition: var(--transition);
    border-left: 2px solid var(--gold);
  }

  .sidebar-item:hover { background: var(--gold-soft); }

  .sidebar-item-info {
    flex: 1 1 auto;
    min-width: 0;
  }

  .sidebar-item-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 1px;
  }

  .sidebar-item-date {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--font-sans);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sidebar-item-delete {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
    opacity: 0.6;
  }

  .sidebar-item:hover .sidebar-item-delete { opacity: 1; }

  .sidebar-item-delete:hover {
    color: var(--accent);
    background: var(--bg-card);
    border-color: var(--accent-soft);
  }

  .sidebar-item-delete svg { width: 10px; height: 10px; }

  .sidebar-header h3 {
    flex: 1 1 auto;
    font-size: 13px;
  }

  .view {
    flex: 1 1 auto;
    display: none;
    min-height: 0;
    animation: fadeIn 240ms ease;
  }

  .view.active { display: flex; flex-direction: column; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="brand-title">一页纸</span>
      <span class="brand-sub">One Page</span>
    </div>
    <nav class="view-tabs" role="tablist">
      <button class="view-tab active" data-view="day" role="tab">日</button>
      <button class="view-tab" data-view="week" role="tab">周</button>
      <button class="view-tab" data-view="month" role="tab">月</button>
      <button class="view-tab" data-view="year" role="tab">年</button>
    </nav>
    <div class="date-nav">
      <button class="today-btn" id="today-btn">今天</button>
      <button class="nav-btn" id="prev-btn" title="上一个">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="date-display" id="date-display" title="点击选择日期"></div>
      <button class="nav-btn" id="next-btn" title="下一个">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="important-sidebar" id="important-sidebar">
      <div class="sidebar-header">
        <h3><span class="star">⭐</span> 重要日子</h3>
        <button class="btn-add-icon" id="sidebar-add-btn" title="添加重要日子">+</button>
        <button class="sidebar-toggle" id="sidebar-toggle-btn" title="收起侧边栏">‹</button>
      </div>
      <div class="sidebar-actions">
        <button class="sidebar-action-btn" id="export-btn" title="导出数据为 JSON">导出</button>
        <button class="sidebar-action-btn" id="import-btn" title="从 JSON 文件导入">导入</button>
        <button class="sidebar-action-btn" id="view-btn" title="查看当前数据">查看</button>
        <input type="file" id="import-file-input" accept=".json,application/json" hidden />
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <div class="sidebar-empty">暂无重要日子<br>点击 + 添加</div>
      </div>
    </aside>
    <main class="main-content">
      <section class="view active" id="day-view">
        <div class="grid" id="day-grid"></div>
      </section>
      <section class="view" id="week-view">
        <div class="week-grid" id="week-grid"></div>
      </section>
      <section class="view" id="month-view">
        <div class="month-container">
          <div class="month-header-row" id="month-header"></div>
          <div class="month-grid" id="month-grid"></div>
        </div>
      </section>
      <section class="view" id="year-view">
        <div class="year-grid" id="year-grid"></div>
      </section>
    </main>
  </div>
</div>

<!-- IMPORTANT DAYS MODAL -->
<div class="modal-backdrop hidden" id="important-modal">
  <div class="modal" role="dialog" aria-labelledby="modal-title">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">重要日子</div>
      <button class="modal-close" id="modal-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div id="important-list"></div>
      <div class="add-row">
        <div class="add-type-tabs">
          <button type="button" class="type-tab active" data-type="solar">阳历</button>
          <button type="button" class="type-tab" data-type="lunar">🌙 阴历</button>
        </div>

        <div class="add-fields" id="add-fields-solar">
          <label class="add-label">选择日期</label>
          <input type="date" class="form-input" id="new-day-date" />
          <label class="recurring-check" title="每年重复显示，例如生日">
            <input type="checkbox" id="new-solar-recurring" checked />
            <span>每年重复</span>
          </label>
        </div>

        <div class="add-fields hidden" id="add-fields-lunar">
          <label class="add-label">选择月日</label>
          <div class="lunar-selects">
            <select class="form-input" id="new-lunar-month">
              <option value="1">正月</option><option value="2">二月</option><option value="3">三月</option>
              <option value="4">四月</option><option value="5">五月</option><option value="6">六月</option>
              <option value="7">七月</option><option value="8">八月</option><option value="9">九月</option>
              <option value="10">十月</option><option value="11">冬月</option><option value="12">腊月</option>
            </select>
            <select class="form-input" id="new-lunar-day">
              <!-- filled by JS -->
            </select>
          </div>
          <label class="lunar-leap-check" title="闰月：少数年份会多出一个月，如闰八月。大多数生日不在闰月。">
            <input type="checkbox" id="new-lunar-leap" />
            <span>闰月（少数情况）</span>
          </label>
          <label class="recurring-check" title="每年重复显示，例如农历生日">
            <input type="checkbox" id="new-lunar-recurring" checked />
            <span>每年重复</span>
          </label>
          <div class="lunar-year-row hidden" id="lunar-year-row">
            <label class="add-label">指定年份（一次性）</label>
            <input type="number" class="form-input" id="new-lunar-year" min="1900" max="2099" placeholder="2026" />
          </div>
        </div>

        <label class="add-label">标题</label>
        <input type="text" class="form-input" id="new-day-title" placeholder="标题，例如 生日、纪念日…" maxlength="40" />

        <button class="btn btn-primary btn-add-confirm" id="add-day-btn">添加</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-done">完成</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="data-view-modal">
  <div class="modal modal-wide" role="dialog" aria-labelledby="data-view-title">
    <div class="modal-header">
      <div class="modal-title" id="data-view-title">数据查看</div>
      <button class="modal-close" data-close="data-view-modal" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div id="data-view-summary" class="data-view-summary"></div>
      <pre id="data-view-json" class="data-view-json"></pre>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="archive-btn">归档 1 年前数据</button>
      <button class="btn btn-secondary" data-close="data-view-modal">关闭</button>
    </div>
  </div>
</div>

<style>
  /* DAY VIEW GRID */
  /* ---- 任务二: 多页导航 ---- */
  .day-page-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px 0 4px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .page-nav-btn {
    border: 1px solid var(--border);
    background: var(--bg-card);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    transition: var(--transition);
  }
  .page-nav-btn:hover:not(:disabled) {
    background: var(--bg-hover);
    color: var(--text);
  }
  .page-nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .page-nav-info {
    letter-spacing: 1px;
    font-family: var(--font-serif);
  }

  #day-view .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    min-height: 0;
  }

  .cell {
    background: var(--bg-card);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background var(--transition);
    min-height: 0;
  }

  .cell:not(.info-cell):hover { background: var(--bg-hover); }
  .cell.completed:not(.info-cell) { background: var(--bg-soft); }
  .cell.cancelled:not(.info-cell) { background: var(--bg-soft); }

  .cell.completed:not(.info-cell)::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top right,
      transparent calc(50% - 1.6px),
      var(--accent) calc(50% - 1.6px),
      var(--accent) calc(50% + 1.6px),
      transparent calc(50% + 1.6px)
    );
    pointer-events: none;
    z-index: 3;
    opacity: 0.88;
  }

  .cell.cancelled:not(.info-cell)::before,
  .cell.cancelled:not(.info-cell)::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }

  .cell.cancelled:not(.info-cell)::before {
    background: linear-gradient(
      to top right,
      transparent calc(50% - 1.6px),
      var(--accent) calc(50% - 1.6px),
      var(--accent) calc(50% + 1.6px),
      transparent calc(50% + 1.6px)
    );
    opacity: 0.88;
  }

  .cell.cancelled:not(.info-cell)::after {
    background: linear-gradient(
      to top left,
      transparent calc(50% - 1.6px),
      var(--accent) calc(50% - 1.6px),
      var(--accent) calc(50% + 1.6px),
      transparent calc(50% + 1.6px)
    );
    opacity: 0.88;
  }

  .cell-content {
    flex: 1 1 auto;
    padding: 14px 16px 12px;
    overflow-y: auto;
    overflow-x: hidden;
    cursor: text;
    font-size: 13px;
    line-height: 1.65;
    word-wrap: break-word;
    min-height: 0;
  }

  .cell-content > *:first-child { margin-top: 0; }
  .cell-content > *:last-child { margin-bottom: 0; }
  .cell-content h1 { font-size: 18px; font-weight: 600; margin: 6px 0; }
  .cell-content h2 { font-size: 16px; font-weight: 600; margin: 5px 0; }
  .cell-content h3 { font-size: 14px; font-weight: 600; margin: 4px 0; color: var(--text-secondary); }
  .cell-content p { margin: 4px 0; }
  .cell-content ul, .cell-content ol { margin: 4px 0 4px 20px; }
  .cell-content li { margin: 2px 0; }
  .cell-content strong { font-weight: 600; }
  .cell-content em { font-style: italic; color: var(--text-secondary); }
  .cell-content a {
    color: var(--info-accent);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
  }
  .cell-content a:hover { color: var(--accent); }
  .cell-content code {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--bg-soft);
    padding: 1px 4px;
    border-radius: 3px;
  }
  .cell-content blockquote {
    border-left: 2px solid var(--border-strong);
    padding-left: 10px;
    color: var(--text-secondary);
    font-style: italic;

<script>
const STORAGE_KEY = 'one-page-planner:v1';

/* =====================================================================
 *  任务七: 存储压缩辅助 (gzip + base64)
 *  存储格式: 'GZ|' + base64(gzip(json))，不支持 CompressionStream 时回退纯 JSON
 * ===================================================================== */
function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function compressJSON(json) {
  const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return 'GZ|' + arrayBufferToBase64(buf);
}

async function decompressJSON(payload) {
  if (typeof payload !== 'string' || !payload.startsWith('GZ|')) {
    return JSON.parse(payload);
  }
  const buf = base64ToArrayBuffer(payload.slice(3));
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  const json = await new Response(stream).text();
  return JSON.parse(json);
}

/* =====================================================================
 *  任务三: 4×4 功能分区 + 重要性排序 (单一事实源)
 *  Grid 布局 (4 列 × 4 行, index 0 = 左上 info, CSS Grid row-major 自动填充):
 *    row 0: 0(info) 1(work) 2(flex) 3(personal)
 *    row 1: 4(work) 5(work) 6(flex)  7(personal)
 *    row 2: 8(work) 9(work) 10(flex) 11(personal)
 *    row 3: 12(work) 13(work) 14(flex) 15(personal)
 *
 *  归属栏:
 *    col 0 (含 info + work 扩展) | col 1 (work) → 工作
 *    col 2 (flex) → 灵活
 *    col 3 (personal) → 个人/人际
 *
 *  重要性排序 (单页 / 跨页统一):
 *    1) 列优先级: work > flex > personal
 *    2) 同列内: 上 (row 0) > 下 (row 3)
 * ===================================================================== */
const COLUMN_OF = (index) => index % 4;
const ROW_OF    = (index) => Math.floor(index / 4);

const COLUMN_TYPE_OF = (index) => {
  if (index === 0) return 'info';
  const c = COLUMN_OF(index);
  if (c === 0 || c === 1) return 'work';
  if (c === 2) return 'flex';
  if (c === 3) return 'personal';
  return 'unknown';
};

const COLUMN_WEIGHT = { work: 3, flex: 2, personal: 1 };
const ROW_WEIGHT    = (row) => 4 - row; // row 0 → 4, row 3 → 1

// 综合分数: 同列内 上 (rowWeight 高) > 下; 列间 work > flex > personal
const itemImportance = (index) => {
  if (index === 0) return -1;
  const colWeight = COLUMN_WEIGHT[COLUMN_TYPE_OF(index)] || 0;
  const rowWeight = ROW_WEIGHT(ROW_OF(index));
  return colWeight * 10 + rowWeight;
};

const Store = {
  data: null,
  _saveTimer: null,

  async load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        this.data = null;
      } else if (typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined') {
        this.data = await decompressJSON(raw);
      } else {
        this.data = JSON.parse(raw);
      }
    } catch (e) {
      console.warn('Failed to load data', e);
      this.data = null;
    }
    if (!this.data) {
      this.data = {
        cells: {},
        importantDays: [],
        settings: { location: '', weather: '', city: '', locationSource: 'manual', geo: null, weatherDisabled: false }
      };
    }
    if (!this.data.importantDays) this.data.importantDays = [];
    if (!this.data.settings) this.data.settings = { location: '', weather: '', city: '', locationSource: 'manual', geo: null };
    if (!('city' in this.data.settings)) this.data.settings.city = '';
    if (!('locationSource' in this.data.settings)) this.data.settings.locationSource = 'manual';
    if (!('geo' in this.data.settings)) this.data.settings.geo = null;
    if (!('weatherDisabled' in this.data.settings)) this.data.settings.weatherDisabled = false;
    if (!this.data.cells) this.data.cells = {};

    // 数据迁移 (任务二): 旧 cells[dateStr][index] → cells[dateStr] = { pages: [...] }
    for (const dateStr in this.data.cells) {
      const day = this.data.cells[dateStr];
      if (day && !day.pages && typeof day === 'object') {
        this.data.cells[dateStr] = { pages: [day] };
      }
    }

    // 数据迁移: 旧的阳历带完整日期 → 改为 recurring 模式 (每年重复)
    this.data.importantDays = this.data.importantDays.map(item => {
      if (item.type === 'solar' && item.date && !('recurring' in item)) {
        const parts = item.date.split('-');
        if (parts.length === 3) {
          return {
            ...item,
            month: parseInt(parts[1]),
            day: parseInt(parts[2]),
            recurring: true
          };
        }
      }
      if (item.type === 'lunar' && !('recurring' in item)) {
        item.recurring = true;
      }
      return item;
    });
  },

  save() {
    clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(() => {
      this._persist();
    }, 200);
  },

  // 任务七: 压缩持久化 (gzip + base64, 不支持时回退 JSON)
  async _persist() {
    try {
      const json = JSON.stringify(this.data);
      let payload = json;
      if (typeof CompressionStream !== 'undefined') {
        try {
          payload = await compressJSON(json);
        } catch (e) {
          payload = json;
        }
      }
      localStorage.setItem(STORAGE_KEY, payload);
    } catch (e) {
      // 任务七: 容量不足降级提示
      if (e && (e.name === 'QuotaExceededError' || e.code === 22)) {
        alert('存储空间已满，建议在侧边栏「查看」中归档或导出备份数据');
      } else {
        console.warn('Failed to save data', e);
      }
    }
  },

  // ---- 多页支持 (任务二): cells[dateStr] = { pages: [page0, page1, ...] }
  // 每个 page 是一个 16 项的稀疏对象 (index 0 = info 格占位, 1~15 = 内容格)
  // info 格不存数据, 渲染时根据 date 实时生成

  getCell(dateStr, index, pageIdx) {
    if (pageIdx === undefined) pageIdx = this.getCurrentPage(dateStr);
    const day = this.data.cells[dateStr];
    if (!day || !day.pages || !day.pages[pageIdx]) return { content: '', status: 'active', note: '' };
    const c = day.pages[pageIdx][index];
    if (!c) return { content: '', status: 'active', note: '' };
    return { content: c.content || '', status: c.status || 'active', note: c.note || '' };
  },

  setCell(dateStr, index, content, pageIdx) {
    if (pageIdx === undefined) pageIdx = this.getCurrentPage(dateStr);
    if (!this.data.cells[dateStr]) this.data.cells[dateStr] = { pages: [{}] };
    if (!this.data.cells[dateStr].pages[pageIdx]) this.data.cells[dateStr].pages[pageIdx] = {};
    if (!this.data.cells[dateStr].pages[pageIdx][index]) {
      this.data.cells[dateStr].pages[pageIdx][index] = { content: '', status: 'active', note: '' };
    }
    this.data.cells[dateStr].pages[pageIdx][index].content = content;
    this.save();
  },

  setCellStatus(dateStr, index, status, pageIdx) {
    if (pageIdx === undefined) pageIdx = this.getCurrentPage(dateStr);
    if (!this.data.cells[dateStr]) this.data.cells[dateStr] = { pages: [{}] };
    if (!this.data.cells[dateStr].pages[pageIdx]) this.data.cells[dateStr].pages[pageIdx] = {};
    if (!this.data.cells[dateStr].pages[pageIdx][index]) {
      this.data.cells[dateStr].pages[pageIdx][index] = { content: '', status: 'active', note: '' };
    }
    const cell = this.data.cells[dateStr].pages[pageIdx][index];
    cell.status = status;
    // 恢复原状时清空说明 (任务五)
    if (status === 'active') cell.note = '';
    this.save();
  },

  // 任务五: 单独保存格子说明 (仅 completed / cancelled 状态使用)
  setCellNote(dateStr, index, note, pageIdx) {
    if (pageIdx === undefined) pageIdx = this.getCurrentPage(dateStr);
    if (!this.data.cells[dateStr]) this.data.cells[dateStr] = { pages: [{}] };
    if (!this.data.cells[dateStr].pages[pageIdx]) this.data.cells[dateStr].pages[pageIdx] = {};
    if (!this.data.cells[dateStr].pages[pageIdx][index]) {
      this.data.cells[dateStr].pages[pageIdx][index] = { content: '', status: 'active', note: '' };
    }
    this.data.cells[dateStr].pages[pageIdx][index].note = note;
    this.save();
  },

  // 获取指定日期的页数 (没有数据时算 1 页)
  getPageCount(dateStr) {
    const day = this.data.cells[dateStr];
    if (!day || !day.pages || !day.pages.length) return 1;
    return Math.max(1, day.pages.length);
  },

  // 创建/确保某页存在 (供任务二新增另一页时调用)
  ensurePage(dateStr, pageIdx) {
    if (!this.data.cells[dateStr]) this.data.cells[dateStr] = { pages: [] };
    while (this.data.cells[dateStr].pages.length <= pageIdx) {
      this.data.cells[dateStr].pages.push({});
    }
    this.save();
    return this.data.cells[dateStr].pages[pageIdx];
  },

  // 判断某页是否"全填满" (info 格不参与, 即 1~15 全部非空)
  isPageFilled(dateStr, pageIdx) {
    if (pageIdx === undefined) pageIdx = this.getCurrentPage(dateStr);
    const day = this.data.cells[dateStr];
    if (!day || !day.pages || !day.pages[pageIdx]) return false;
    const page = day.pages[pageIdx];
    for (let i = 1; i <= 15; i++) {
      const c = page[i];
      if (!c || !c.content || !c.content.trim()) return false;
    }
    return true;
  },

  // DayView 维护的 UI 状态 (当前查看哪一页)
  _currentPageMap: {},
  getCurrentPage(dateStr) {
    return this._currentPageMap[dateStr] || 0;
  },
  setCurrentPage(dateStr, pageIdx) {
    this._currentPageMap[dateStr] = pageIdx;
  },

  // 跨所有页面聚合 (月/周/年视图需要全局指标)
  getDayIndicators(dateStr) {
    const day = this.data.cells[dateStr];
    if (!day || !day.pages) return { completed: 0, cancelled: 0, active: 0, total: 16 };
    let completed = 0, cancelled = 0, active = 0;
    for (const page of day.pages) {
      for (let i = 0; i < 16; i++) {
        const c = page[i];
        if (!c || !c.content || !c.content.trim()) continue;
        if (c.status === 'completed') completed++;
        else if (c.status === 'cancelled') cancelled++;
        else active++;
      }
    }
    return { completed, cancelled, active, total: 16 };
  },

  // 任务三: 返回按重要性排序的所有非空内容项 (跨所有页面)
  // 元素结构: { index, content, status, pageIdx }
  // 排序规则: 列优先级 (work>flex>personal), 然后同列内 row 0 > row 3
  getDayItemsSorted(dateStr) {
    const day = this.data.cells[dateStr];
    if (!day || !day.pages) return [];
    const items = [];
    for (let pi = 0; pi < day.pages.length; pi++) {
      const page = day.pages[pi];
      for (let i = 1; i <= 15; i++) {
        const c = page[i];
        if (!c || !c.content || !c.content.trim()) continue;
        items.push({ index: i, content: c.content, status: c.status, pageIdx: pi });
      }
    }
    items.sort((a, b) => itemImportance(b.index) - itemImportance(a.index));
    return items;
  },

  // getDayPreviews 改为基于排序结果, 取前 max 条 (默认 3)
  getDayPreviews(dateStr, max = 3) {
    return this.getDayItemsSorted(dateStr)
      .filter(item => item.status === 'active')
      .slice(0, max)
      .map(item => extractTitle(item.content));
  },

  getImportantDays() { return this.data.importantDays; },

  addImportantDay(opts) {
    // opts: { type: 'solar'|'lunar', date?, month?, day?, isLeap?, recurring?, title }
    const id = Date.now() + Math.random().toString(36).slice(2, 6);
    const recurring = opts.recurring !== false; // default true (每年重复)
    const item = {
      id,
      title: opts.title,
      type: opts.type || 'solar',
      recurring
    };
    if (item.type === 'lunar') {
      // 阴历天然就是 recurring (每年重复)
      item.month = opts.month;
      item.day = opts.day;
      item.isLeap = !!opts.isLeap;
      item.recurring = true;
    } else if (recurring) {
      // 阳历 recurring: 只存月日
      item.month = opts.month;
      item.day = opts.day;
    } else {
      // 阳历 one-time: 存完整日期
      item.date = opts.date;
    }
    this.data.importantDays.push(item);
    this.save();
    return item;
  },

  removeImportantDay(id) {
    this.data.importantDays = this.data.importantDays.filter(d => d.id !== id);
    this.save();
  },

  getImportantDaysForDate(dateStr) {
    const d = new Date(dateStr);
    const year = d.getFullYear();
    const month = d.getMonth() + 1;
    const day = d.getDate();
    return this.data.importantDays.filter(item => {
      if (item.type === 'lunar') {
        // 阴历: 每年重复, 转为该年阳历对比
        const solar = lunarToSolar(year, item.month, item.day, item.isLeap);
        if (!solar) return false;
        return solar.getFullYear() === year &&
               solar.getMonth() + 1 === month &&
               solar.getDate() === day;
      }
      // Solar
      if (item.recurring) {
        // 阳历 recurring: 只比对月日
        return item.month === month && item.day === day;
      }
      // Solar one-time: 比对完整日期
      return item.date === dateStr;
    });
  },

  getSettings() { return this.data.settings; },

  updateSettings(patch) {
    this.data.settings = { ...this.data.settings, ...patch };
    this.save();
  }
};

/* =====================================================================
 *  DATE UTILS
 * ===================================================================== */
const DateUtil = {
  pad(n) { return String(n).padStart(2, '0'); },

  toKey(d) { return `${d.getFullYear()}-${this.pad(d.getMonth()+1)}-${this.pad(d.getDate())}`; },

  fromKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  },

  isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
  },

  startOfWeek(d) {
    const x = new Date(d);
    const day = x.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
  },

  startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); },
  startOfYear(d) { return new Date(d.getFullYear(), 0, 1); },

  addDays(d, n) {
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  },
  addMonths(d, n) {
    const x = new Date(d);
    x.setMonth(x.getMonth() + n);
    return x;
  },
  addYears(d, n) {
    const x = new Date(d);
    x.setFullYear(x.getFullYear() + n);
    return x;
  },

  weekdayCN(d) {
    return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  },

  weekdayCNShort(d) {
    return '周' + ['日','一','二','三','四','五','六'][d.getDay()];
  },

  formatMonthYear(d) { return `${d.getFullYear()} 年 ${d.getMonth()+1} 月`; },
  formatYear(d) { return `${d.getFullYear()} 年`; },
  formatDay(d) { return `${d.getMonth()+1} 月 ${d.getDate()} 日`; },

  formatDateLong(d) {
    const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return `${d.getFullYear()}-${this.pad(d.getMonth()+1)}-${this.pad(d.getDate())} ${weekdays[d.getDay()]}`;
  },

  formatDateShort(d) {
    return `${d.getFullYear()}-${this.pad(d.getMonth()+1)}-${this.pad(d.getDate())}`;
  }
};

/* =====================================================================
 *  MARKDOWN PARSER  —  lightweight, safe (no external deps)
 * ===================================================================== */
function escapeHTML(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function parseInline(text) {
  let s = escapeHTML(text);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
    const safe = /^https?:\/\//i.test(u) || /^mailto:/i.test(u) ? u : '#';
    return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${t}</a>`;
  });
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return s;
}

function parseMarkdown(text) {
  if (!text || !text.trim()) return '';
  const lines = text.split('\n');
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    let m;

    if (m = line.match(/^###\s+(.+)$/)) { out.push(`<h3>${parseInline(m[1])}</h3>`); i++; continue; }
    if (m = line.match(/^##\s+(.+)$/))  { out.push(`<h2>${parseInline(m[1])}</h2>`); i++; continue; }
    if (m = line.match(/^#\s+(.+)$/))   { out.push(`<h1>${parseInline(m[1])}</h1>`); i++; continue; }

    if (/^---+\s*$/.test(line)) { out.push('<hr/>'); i++; continue; }

    if (m = line.match(/^>\s?(.*)$/)) {
      let body = parseInline(m[1]);
      while (i + 1 < lines.length && (m = lines[i+1].match(/^>\s?(.*)$/))) {
        body += '<br>' + parseInline(m[1]);
        i++;
      }
      out.push(`<blockquote>${body}</blockquote>`);
      i++; continue;
    }

    if (/^[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
        items.push(`<li>${parseInline(lines[i].replace(/^[-*]\s+/, ''))}</li>`);
        i++;
      }
      out.push(`<ul>${items.join('')}</ul>`);
      continue;
    }

    if (/^\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
        items.push(`<li>${parseInline(lines[i].replace(/^\d+\.\s+/, ''))}</li>`);
        i++;
      }
      out.push(`<ol>${items.join('')}</ol>`);
      continue;
    }

    if (!line.trim()) { i++; continue; }

    let para = parseInline(line);
    while (i + 1 < lines.length && lines[i+1].trim() &&
           !/^#{1,3}\s/.test(lines[i+1]) &&
           !/^[-*]\s+/.test(lines[i+1]) &&
           !/^\d+\.\s+/.test(lines[i+1]) &&
           !/^>\s?/.test(lines[i+1]) &&
           !/^---+\s*$/.test(lines[i+1])) {
      i++;
      para += '<br>' + parseInline(lines[i]);
    }
    out.push(`<p>${para}</p>`);
    i++;
  }

  return out.join('');
}

function stripMarkdown(text) {
  return text
    .replace(/^#{1,3}\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/^[-*]\s+/gm, '· ')
    .replace(/^\d+\.\s+/gm, '· ')
    .replace(/^>\s?/gm, '')
    .replace(/\n+/g, ' ')
    .trim();
}

// Extract a short title from markdown content for month-view previews:
//   1) if there is a '# heading' line, use the heading text
//   2) else use the first non-empty line, stripped of basic markdown
//   3) truncated to ~24 chars with ellipsis
function extractTitle(content) {
  if (!content) return '';
  const lines = content.split('\n');
  for (const line of lines) {
    const m = line.match(/^#{1,3}\s+(.+)$/);
    if (m) {
      const t = m[1].trim();
      return t.length > 24 ? t.slice(0, 24) + '…' : t;
    }
  }
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    const stripped = t
      .replace(/^[-*]\s+/, '')
      .replace(/^\d+\.\s+/, '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/\*([^*]+)\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
    return stripped.length > 24 ? stripped.slice(0, 24) + '…' : stripped;
  }
  return '';
}

/* =====================================================================
 *  DAY VIEW
 * ===================================================================== */
const DayView = {
  // 当前日期正在查看的页 (索引). 跨日期独立, 默认 0.
  _currentPageByDate: {},

  _getCurrentPage(dateStr) {
    const totalPages = Store.getPageCount(dateStr);
    const cur = this._currentPageByDate[dateStr] || 0;
    return Math.min(Math.max(0, cur), totalPages - 1);
  },

  _setCurrentPage(dateStr, n) {
    const totalPages = Store.getPageCount(dateStr);
    this._currentPageByDate[dateStr] = Math.min(Math.max(0, n), totalPages - 1);
    Store.setCurrentPage(dateStr, this._currentPageByDate[dateStr]);
  },

  render(date) {
    const dateStr = DateUtil.toKey(date);
    const pageIdx = this._getCurrentPage(dateStr);
    Store.setCurrentPage(dateStr, pageIdx);
    const totalPages = Store.getPageCount(dateStr);

    const grid = document.getElementById('day-grid');
    grid.innerHTML = '';
    grid.dataset.pageIdx = String(pageIdx);

    grid.appendChild(this.buildInfoCell(date));

    for (let i = 1; i < 16; i++) {
      grid.appendChild(this.buildCell(dateStr, i, pageIdx));
    }

    this.renderPageNav(dateStr, pageIdx, totalPages);
  },

  renderPageNav(dateStr, pageIdx, totalPages) {
    let nav = document.getElementById('day-page-nav');
    if (!nav) {
      nav = document.createElement('div');
      nav.id = 'day-page-nav';
      nav.className = 'day-page-nav';
      document.getElementById('day-view').appendChild(nav);
    }
    if (totalPages <= 1) {
      nav.innerHTML = '';
      nav.style.display = 'none';
      return;
    }
    nav.style.display = '';
    const prevDisabled = pageIdx === 0 ? 'disabled' : '';
    const nextDisabled = pageIdx === totalPages - 1 ? 'disabled' : '';
    nav.innerHTML = '<button class="page-nav-btn" data-action="prev" ' + prevDisabled + '>◀</button>' +
      '<span class="page-nav-info">第 ' + (pageIdx + 1) + ' 页 / 共 ' + totalPages + ' 页</span>' +
      '<button class="page-nav-btn" data-action="next" ' + nextDisabled + '>▶</button>';
    nav.querySelector('[data-action="prev"]')?.addEventListener('click', () => {
      if (pageIdx === 0) return;
      this._setCurrentPage(dateStr, pageIdx - 1);
      App.render();
    });
    nav.querySelector('[data-action="next"]')?.addEventListener('click', () => {
      if (pageIdx >= totalPages - 1) return;
      this._setCurrentPage(dateStr, pageIdx + 1);
      App.render();
    });
  },

  buildInfoCell(date) {
    const cell = document.createElement('div');
    cell.className = 'cell info-cell';

    const dateStr = DateUtil.toKey(date);
    const today = new Date();
    const isToday = DateUtil.isSameDay(date, today);
    const settings = Store.getSettings();
    const wDisp = Weather.getDisplayWeather();
    const important = Store.getImportantDaysForDate(dateStr);

    // 提取天气描述（去掉温度）
    let weatherDesc = (wDisp.weather || '').replace(/\s*-?\d+\s*[°º]\s*C?\s*$/i, '').replace(/\s*-?\d+\s*°\s*$/i, '').trim();
    if (!weatherDesc || weatherDesc === '未知天气' || weatherDesc === '未知') weatherDesc = '';

    // 地点：去掉国家名
    let displayLoc = wDisp.location || '';
    if (displayLoc.includes('·')) {
      displayLoc = displayLoc.split('·')[0].trim();
    }
    if (displayLoc === '未知位置' || displayLoc === '—' || displayLoc === '未知') displayLoc = '';

    // 整行日期+星期
    const dateLine = `${date.getFullYear()} 年 ${date.getMonth()+1} 月 ${date.getDate()} 日 · ${DateUtil.weekdayCN(date)}`;

    cell.innerHTML = `
      <div class="info-date-line">
        <span class="info-date-text">${dateLine}</span>
        ${important.length > 0 ? `<span class="info-important-badge" title="${important.length} 个重要日子">⭐ ${important.length}</span>` : ''}
      </div>
      ${important.length > 0 ? `
        <div class="info-important-list">
          ${important.map(d => {
            const isLunar = d.type === 'lunar';
            return `<div class="info-important-item ${isLunar ? 'is-lunar' : ''}">
              <span class="star">${ICONS.star}</span>
              <span class="info-important-title">${escapeHTML(d.title)}</span>
            </div>`;
          }).join('')}
        </div>
      ` : ''}
      ${isToday ? `
        <div class="info-today-row">
          ${weatherDesc ? `<span class="info-weather-text">${escapeHTML(weatherDesc)}</span>` : ''}
          ${weatherDesc && displayLoc ? `<span class="info-divider">·</span>` : ''}
          ${displayLoc ? `<span class="info-location-text">${escapeHTML(displayLoc)}</span>` : ''}
          <button class="info-meta-action" data-action="geo" title="重新定位">📍</button>
        </div>
      ` : ''}
    `;

    // Location button handler
    const geoBtn = cell.querySelector('[data-action="geo"]');
    if (geoBtn) {
      geoBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        try {
          Store.updateSettings({ city: '' });
          await Weather.refreshGeolocation();
          App.render();
        } catch (err) {
          const city = prompt('无法获取浏览器定位。请手动输入城市：');
          if (city && city.trim()) {
            Store.updateSettings({ city: city.trim() });
            await Weather.refresh();
          }
        }
      });
    }

    return cell;
  },

  buildCell(dateStr, index, pageIdx) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = index;
    cell.dataset.pageIdx = pageIdx;
    cell.tabIndex = 0;

    const data = Store.getCell(dateStr, index, pageIdx);
    cell.classList.add(data.status);

    const content = document.createElement('div');
    content.className = 'cell-content';
    this.renderContent(content, data.content);
    cell.appendChild(content);

    // 任务五: 已完成/取消格子的说明文字 (红色)
    if (data.status !== 'active' && data.note && data.note.trim()) {
      const note = document.createElement('div');
      note.className = 'status-note';
      note.textContent = data.note;
      cell.appendChild(note);
    }

    // status is communicated visually via the diagonal line / X overlay and the restore button

    const actions = document.createElement('div');
    actions.className = 'cell-actions';
    if (data.status === 'active') {
      actions.innerHTML = `
        <button class="cell-action complete" title="标记完成">${ICONS.check}</button>
        <button class="cell-action cancel" title="标记取消">${ICONS.x}</button>
      `;
    } else {
      actions.innerHTML = `
        <button class="cell-action restore" title="恢复原状">${ICONS.restore}</button>
      `;
    }
    cell.appendChild(actions);

    // 整个格子都可点击进入编辑 (正文 + 红色说明 + 覆盖层区域)
    cell.addEventListener('click', (e) => {
      // 排除右下角操作按钮
      if (e.target.closest && e.target.closest('.cell-actions')) return;
      this.enterEdit(cell, dateStr, index, pageIdx);
    });

    actions.querySelector('.complete')?.addEventListener('click', (e) => {
      e.stopPropagation();
      Store.setCellStatus(dateStr, index, 'completed');
      App.render();
    });

    actions.querySelector('.cancel')?.addEventListener('click', (e) => {
      e.stopPropagation();
      Store.setCellStatus(dateStr, index, 'cancelled');
      App.render();
    });

    actions.querySelector('.restore')?.addEventListener('click', (e) => {
      e.stopPropagation();
      Store.setCellStatus(dateStr, index, 'active');
      App.render();
    });

    return cell;
  },

  renderContent(el, markdown) {
    if (markdown && markdown.trim()) {
      el.innerHTML = parseMarkdown(markdown);
    } else {
      el.innerHTML = '<div class="placeholder">点击此处开始书写…</div>';
    }
  },

  enterEdit(cell, dateStr, index, pageIdx) {
    if (cell.classList.contains('editing')) return;
    cell.classList.add('editing');

    const data = Store.getCell(dateStr, index, pageIdx);
    const currentContent = data.content;
    const currentNote = data.note || '';
    const canEditNote = data.status === 'completed' || data.status === 'cancelled';

    const content = cell.querySelector('.cell-content');
    const oldNote = cell.querySelector('.status-note');

    // 任务五: 编辑容器 = 正文 textarea + (可选) 说明 textarea
    const wrap = document.createElement('div');
    wrap.className = 'cell-edit-wrap';

    const textarea = document.createElement('textarea');
    textarea.className = 'cell-textarea';
    textarea.value = currentContent;
    textarea.placeholder = '支持 Markdown：# 标题、**加粗**、*斜体*、[链接](url)、- 列表…';
    textarea.spellcheck = false;
    wrap.appendChild(textarea);

    let noteInput = null;
    if (canEditNote) {
      noteInput = document.createElement('textarea');
      noteInput.className = 'cell-note-input';
      noteInput.value = currentNote;
      noteInput.placeholder = data.status === 'completed' ? '完成说明（保存后红色字显示）' : '取消原因（保存后红色字显示）';
      noteInput.spellcheck = false;
      wrap.appendChild(noteInput);
    }

    // 移除旧的正文显示和说明显示，再插入编辑容器
    if (oldNote) cell.removeChild(oldNote);
    cell.replaceChild(wrap, content);

    textarea.focus();
    textarea.selectionStart = textarea.selectionEnd = textarea.value.length;

    let saved = false;
    const save = () => {
      if (saved) return;
      saved = true;
      const newContent = textarea.value;
      if (newContent !== currentContent) {
        Store.setCell(dateStr, index, newContent, pageIdx);
      }
      if (noteInput) {
        const newNote = noteInput.value;
        if (newNote !== currentNote) {
          Store.setCellNote(dateStr, index, newNote, pageIdx);
        }
      }
      App.render();
    };

    textarea.addEventListener('blur', save);
    if (noteInput) noteInput.addEventListener('blur', save);
    if (noteInput) {
      noteInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || ((e.metaKey || e.ctrlKey) && e.key === 'Enter')) {
          e.preventDefault();
          save();
        }
        e.stopPropagation();
      });
    }
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        save();
      } else if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        save();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        save();
        // 任务二: cell 15 + 全填满 → 询问新增另一页
        if (index === 15 && Store.isPageFilled(dateStr, pageIdx)) {
          if (confirm('格子已用完，是否新增另一页？')) {
            const nextPage = pageIdx + 1;
            Store.ensurePage(dateStr, nextPage);
            this._setCurrentPage(dateStr, nextPage);
            App.render();
            setTimeout(() => {
              const nextCell = document.querySelector(`#day-grid .cell[data-index="1"]`);
              if (nextCell) nextCell.querySelector('.cell-content')?.click();
            }, 60);
            return;
          }
          // 取消则停留在原格 (不换格)
          return;
        }
        // 正常翻格: 末格回环到第 1 格
        const nextIndex = index === 15 ? 1 : index + 1;
        setTimeout(() => {
          const nextCell = document.querySelector(`#day-grid .cell[data-index="${nextIndex}"]`);
          if (nextCell) nextCell.querySelector('.cell-content')?.click();
        }, 60);
      }
      e.stopPropagation();
    });
  }
};

const WeekView = {
  render(date) {
    const start = DateUtil.startOfWeek(date);
    const grid = document.getElementById('week-grid');
    grid.innerHTML = '';

    const today = new Date();
    for (let i = 0; i < 7; i++) {
      const d = DateUtil.addDays(start, i);
      const dateStr = DateUtil.toKey(d);
      const day = document.createElement('div');
      day.className = 'week-day';
      if (DateUtil.isSameDay(d, today)) day.classList.add('today');
      if (d.getDay() === 0 || d.getDay() === 6) day.classList.add('weekend');

      const important = Store.getImportantDaysForDate(dateStr);

      // 任务三: 周视图统一走 getDayItemsSorted (按重要性排序 + 跨页)
      let cellSummaries = '';
      for (const item of Store.getDayItemsSorted(dateStr)) {
        const plain = stripMarkdown(item.content);
        if (plain) {
          const cls = item.status === 'completed' ? 'completed' : item.status === 'cancelled' ? 'cancelled' : '';
          cellSummaries += `<div class="week-cell-mini ${cls}" title="${escapeHTML(plain)}">${escapeHTML(plain)}</div>`;
        }
      }

      const importantDot = important.length ? '<span class="week-important-dot"></span>' : '';

      day.innerHTML = `
        <div class="week-day-header">
          <div class="week-day-name">${DateUtil.weekdayCNShort(d)}${importantDot}</div>
          <div class="week-day-num">${d.getDate()}</div>
        </div>
        <div class="week-day-body">
          ${cellSummaries || '<div class="week-day-empty">空白的一天</div>'}
        </div>
      `;

      day.addEventListener('click', () => {
        App.setDate(d);
        App.setView('day');
      });

      grid.appendChild(day);
    }
  }
};

/* =====================================================================

const MonthView = {
  render(date) {
    const today = new Date();
    const year = date.getFullYear();
    const month = date.getMonth();
    const firstDay = new Date(year, month, 1);

    const dowHeader = document.getElementById('month-header');
    const dowNames = ['一', '二', '三', '四', '五', '六', '日'];
    dowHeader.innerHTML = dowNames.map(d => `<div class="month-dow">周${d}</div>`).join('');

    const grid = document.getElementById('month-grid');
    grid.innerHTML = '';

    let cursor = DateUtil.startOfWeek(firstDay);

    for (let i = 0; i < 42; i++) {
      const cellDate = new Date(cursor);
      const dateStr = DateUtil.toKey(cellDate);
      const isOtherMonth = cellDate.getMonth() !== month;

      const cell = document.createElement('div');
      cell.className = 'month-cell';
      if (isOtherMonth) cell.classList.add('other-month');
      if (cellDate.getDay() === 0 || cellDate.getDay() === 6) cell.classList.add('weekend');
      if (DateUtil.isSameDay(cellDate, today)) cell.classList.add('today');

      const ind = Store.getDayIndicators(dateStr);
      const previews = Store.getDayPreviews(dateStr, 3);
      const important = Store.getImportantDaysForDate(dateStr);

      const totalDone = ind.completed + ind.active + ind.cancelled;
      const pct = totalDone > 0 ? Math.round((ind.completed / totalDone) * 100) : 0;

      // 任务四: 顶部行 = 日期号 + 进度条 (合并到一行, 节省垂直空间)
      const progressHTML = totalDone > 0 ? `
        <span class="month-progress-row">
          <span class="month-progress-bar"><span class="month-progress-fill" style="width:${pct}%"></span></span>
          <span class="month-progress-text">${ind.completed}/${totalDone}</span>
        </span>
      ` : '';

      // 任务四: 重要日子专用区域 (顶部, 彩色圆点 + 标题缩写, +N if more)
      const importantHTML = important.length
        ? `<div class="month-important-tags" title="${important.map(d => escapeHTML(d.title)).join(', ')}">
             <span class="dot"></span>
             <span class="label">${escapeHTML(important[0].title)}</span>
             ${important.length > 1 ? `<span class="more">+${important.length - 1}</span>` : ''}
           </div>`
        : '';

      // 事项预览: 占用剩余垂直空间 (flex: 1)
      const previewsHTML = previews.length > 0 ? `
        <ul class="month-previews">
          ${previews.map(p => `<li>${escapeHTML(p.length > 28 ? p.slice(0, 28) + '…' : p)}</li>`).join('')}
        </ul>
      ` : '';

      cell.innerHTML = `
        <div class="month-cell-top">
          <span class="month-day-num">${cellDate.getDate()}</span>
          ${progressHTML}
        </div>
        ${importantHTML}
        ${previewsHTML}
      `;

      cell.addEventListener('click', () => {
        App.setDate(cellDate);
        App.setView('day');
      });

      grid.appendChild(cell);
      cursor = DateUtil.addDays(cursor, 1);
    }
  }
};

const YearView = {
  render(date) {

    const today = new Date();
    const grid = document.getElementById('year-grid');
    grid.innerHTML = '';

    for (let m = 0; m < 12; m++) {
      const monthBox = document.createElement('div');
      monthBox.className = 'year-month';

      const firstDay = new Date(year, m, 1);
      const startCursor = DateUtil.startOfWeek(firstDay);
      const days = [];
      const dowNames = ['一', '二', '三', '四', '五', '六', '日'];

      for (const d of dowNames) {
        days.push(`<div class="year-dow-cell">${d}</div>`);
      }

      for (let i = 0; i < 42; i++) {
        const cellDate = new Date(startCursor);
        cellDate.setDate(startCursor.getDate() + i);
        const dateStr = DateUtil.toKey(cellDate);
        const isOtherMonth = cellDate.getMonth() !== m;
        const indicators = Store.getDayIndicators(dateStr);
        const important = Store.getImportantDaysForDate(dateStr);

        let cls = 'year-day-cell';
        if (isOtherMonth) cls += ' other-month';
        if (DateUtil.isSameDay(cellDate, today)) cls += ' today';
        if (indicators.completed > 0) cls += ' has-completed';
        else if (indicators.hasContent > 0 || indicators.cancelled > 0) cls += ' has-content';
        if (important.length) cls += ' has-important';

        days.push(`<div class="${cls}">${cellDate.getDate()}</div>`);
      }

      monthBox.innerHTML = `
        <div class="year-month-name">${m + 1} 月</div>
        <div class="year-month-grid">${days.join('')}</div>
      `;

      monthBox.addEventListener('click', () => {
        App.setDate(new Date(year, m, 1));
        App.setView('month');
      });

      grid.appendChild(monthBox);
    }
  }
};

function translateWeather(enDesc) {
  if (!enDesc) return '';
  // Already Chinese? pass through (contains CJK characters)
  if (/[\u4e00-\u9fa5]/.test(enDesc)) return enDesc;
  const lower = enDesc.toLowerCase().trim();
  if (WEATHER_TRANSLATIONS[lower]) return WEATHER_TRANSLATIONS[lower];
  // Try partial matches (in case of variations)
  for (const [en, zh] of Object.entries(WEATHER_TRANSLATIONS)) {
    if (lower.includes(en)) return zh;
  }
  // Last resort: return original
  return enDesc;
}

function hasChinese(text) {
  return /[\u4e00-\u9fa5]/.test(text || '');
}

const LUNAR_MONTH_NAMES = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const LUNAR_DAY_NAMES = [
  '初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'
];

const LUNAR_HEAVENLY_STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const LUNAR_EARTHLY_BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const LUNAR_ZODIAC = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

// 数据编码: 位4-15 存放12个月的大小 (位4=月1, 位15=月12, 1=30天, 0=29天)
// 位0-3 存放闰月月份 (0=无闰月), 位16 存放闰月天数 (1=30天, 0=29天)
function lunarYearDays(y) {
  let sum = 348; // 12 * 29
  for (let m = 1; m <= 12; m++) {
    if (LUNAR_INFO[y-1900] & (1 << (m + 3))) sum += 1;  // bit (m+3) for month m
  }
  return sum + lunarLeapDays(y);
}

function lunarLeapMonth(y) {
  return LUNAR_INFO[y-1900] & 0xf;
}

function lunarLeapDays(y) {
  if (lunarLeapMonth(y)) {
    return (LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29;
  }
  return 0;
}

function lunarMonthDays(y, m) {
  return (LUNAR_INFO[y-1900] & (1 << (m + 3))) ? 30 : 29;
}

// 阴历转阳历. 返回 Date 对象或 null (日期无效)
function lunarToSolar(year, month, day, isLeap) {
  if (year < 1900 || year > 2099) return null;
  if (month < 1 || month > 12) return null;
  if (day < 1 || day > 30) return null;
  const leap = lunarLeapMonth(year);
  if (isLeap && leap !== month) return null; // 该年没有这个闰月
  // Validate day count
  let mDays;
  if (isLeap) {
    mDays = lunarLeapDays(year);
  } else {
    mDays = lunarMonthDays(year, month);
  }
  if (day > mDays) return null;

  let offset = 0;
  for (let y = 1900; y < year; y++) offset += lunarYearDays(y);

  for (let m = 1; m < month; m++) {
    offset += lunarMonthDays(year, m);
    if (m === leap) offset += lunarLeapDays(year);
  }

  // (No post-loop leap check: the leap is already inserted in the m===leap branch above)

  // If querying the leap month, we need to add the regular month's days first
  // because the loop only adds months 1..(month-1).
  if (isLeap) {
    offset += lunarMonthDays(year, month);
  }

  offset += day - 1;
  // 1900-01-31 = lunar 1900-01-01 (1900年正月初一)
  // 使用 Date.UTC 避免 1900 之前历史时区差异造成的 1 天偏移
  const result = new Date(Date.UTC(1900, 0, 31) + offset * 86400000);
  return result;
}

// 阳历转阴历. 返回 { year, month, day, isLeap }
function solarToLunar(date) {
  const baseDate = new Date(1900, 0, 31);
  baseDate.setHours(0,0,0,0);
  const d = new Date(date);
  d.setHours(0,0,0,0);
  let offset = Math.round((d - baseDate) / 86400000);

  let year = 1900;
  let yearDays;
  while (year < 2100) {
    yearDays = lunarYearDays(year);
    if (offset < yearDays) break;
    offset -= yearDays;
    year++;
  }
  if (year >= 2100) return null;

  const leap = lunarLeapMonth(year);
  let isLeap = false;
  let month = 1;
  for (let m = 1; m <= 12; m++) {
    let mDays = lunarMonthDays(year, m);
    if (offset < mDays) { month = m; break; }
    offset -= mDays;
    if (m === leap) {
      mDays = lunarLeapDays(year);
      if (offset < mDays) { month = m; isLeap = true; break; }
      offset -= mDays;
    }
  }
  const day = offset + 1;
  return { year, month, day, isLeap };
}

// 格式化阴历显示, 如 "八月廿八"
function formatLunar(month, day, isLeap) {
  const prefix = isLeap ? '闰' : '';
  return prefix + LUNAR_MONTH_NAMES[month-1] + '月' + LUNAR_DAY_NAMES[day-1];
}

// 干支纪年, 如 "丙午年"
function lunarYearGanZhi(year) {
  // 1864年是甲子年
  const offset = (year - 1864) % 60;
  const stem = LUNAR_HEAVENLY_STEMS[((offset % 10) + 10) % 10];
  const branch = LUNAR_EARTHLY_BRANCHES[((offset % 12) + 12) % 12];
  const zodiac = LUNAR_ZODIAC[((offset % 12) + 12) % 12];
  return stem + branch + ' (' + zodiac + ') 年';
}


/* =====================================================================
 *  WEATHER / LOCATION
 *  Source priority (each tier falls through to the next on failure):
 *    1) User-set city in settings (manual entry, always wins)
 *    2) Browser navigator.geolocation (precise, requires permission + HTTPS)
 *    3) wttr.in IP-geolocation (free, no API key, no permission needed)
 *    4) Cached previous value
 *    5) Manual placeholder ('—')
 * ===================================================================== */
const Weather = {
  _cache: null,
  _ts: 0,
  _geoCache: null,        // { lat, lng, ts }
  _geoTs: 0,
  _cityCache: null,       // resolved city name from lat/lng
  _cityTs: 0,
  _ttl: 30 * 60 * 1000,   // 30 min for weather
  _geoTtl: 60 * 60 * 1000, // 1 hour for geolocation
  _cityTtl: 24 * 60 * 60 * 1000, // 24h for city name

  // 检查用户是否禁用了天气/位置功能
  isDisabled() {
    return !!(Store.getSettings().weatherDisabled);
  },

  disable() {
    Store.updateSettings({ weatherDisabled: true });
    this._cache = null;
    App.render();
  },

  enable() {
    Store.updateSettings({ weatherDisabled: false });
    this.fetch(true).then(() => App.render());
  },

  // ---- Geolocation (browser-local, 主要数据源) ----
  isGeoSupported() {
    return !!(typeof navigator !== 'undefined' && navigator.geolocation);
  },

  isSecureContext() {
    if (typeof window === 'undefined') return false;
    const isLocal = /^(localhost|127\.0\.0\.1|::1)$/.test(window.location.hostname);
    return window.isSecureContext || isLocal;
  },

  // Returns Promise<{ lat, lng, accuracy }>
  getGeolocation(force = false) {
    return new Promise((resolve, reject) => {
      if (!this.isGeoSupported()) return reject(new Error('浏览器不支持定位 API'));
      if (!this.isSecureContext()) return reject(new Error('需要 HTTPS 或 localhost 才能使用定位'));
      if (!force && this._geoCache && (Date.now() - this._geoTs) < this._geoTtl) {
        return resolve(this._geoCache);
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const result = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy
          };
          this._geoCache = result;
          this._geoTs = Date.now();
          if (Store.data) {
            Store.data.settings.geo = result;
            Store.save();
          }
          resolve(result);
        },
        (err) => {
          const reasons = { 1: '用户拒绝定位', 2: '定位不可用', 3: '定位超时' };
          reject(new Error(reasons[err.code] || err.message));
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: this._geoTtl }
      );
    });
  },

  // 使用 Nominatim (OSM) 反向地理编码，免费无 key，中文结果
  // 适合中国大陆用户
  async reverseGeocode(lat, lng) {
    if (this._cityCache && (Date.now() - this._cityTs) < this._cityTtl) {
      return this._cityCache;
    }
    try {
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 5000);
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=zh-CN&zoom=10`;
      const res = await fetch(url, {
        signal: ctrl.signal,
        headers: { 'User-Agent': 'OnePagePlanner/1.0' }
      });
      clearTimeout(timeout);
      if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      const a = data.address || {};
      // 优先级: city > town > county > state
      const cityName = a.city || a.town || a.county || a.state || '';
      const country = a.country_code ? a.country_code.toUpperCase() : '';
      this._cityCache = cityName;
      this._cityTs = Date.now();
      return cityName;
    } catch (e) {
      console.warn('Reverse geocode failed:', e.message);
      return '';
    }
  },

  // ---- Main fetch ----
  async fetch(force = false) {
    if (this.isDisabled()) {
      return { location: '', weather: '', disabled: true };
    }
    const now = Date.now();
    if (!force && this._cache && (now - this._ts) < this._ttl) {
      return this._cache;
    }
    const settings = Store.getSettings();
    const userCity = (settings.city || '').trim();
    let displayCity = userCity;
    let source = userCity ? 'user' : 'pending';
    let weatherDesc = '';

    // 优先尝试用浏览器定位获取精确位置 (本地数据)
    let geo = null;
    try {
      geo = await this.getGeolocation(force);
      if (!userCity) {
        // 反向地理编码获取城市名
        const cityName = await this.reverseGeocode(geo.lat, geo.lng);
        if (cityName) {
          displayCity = cityName;
          source = 'geolocation';
        }
      }
    } catch (geoErr) {
      console.warn('Geolocation skipped:', geoErr.message);
    }

    // 尝试用 wttr.in 获取天气 (可选)
    if (displayCity) {
      try {
        const ctrl = new AbortController();
        const timeout = setTimeout(() => ctrl.abort(), 6000);
        const url = userCity
          ? `https://wttr.in/${encodeURIComponent(userCity)}?format=j1&lang=zh`
          : `https://wttr.in/${geo.lat.toFixed(4)},${geo.lng.toFixed(4)}?format=j1&lang=zh`;
        const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(timeout);
        if (res.ok) {
          const data = await res.json();
          const cc = data?.current_condition?.[0];
          const rawDesc = cc?.lang_zh?.[0]?.value || cc?.weatherDesc?.[0]?.value || '';
          weatherDesc = translateWeather(rawDesc);
          if (weatherDesc === '未知天气') weatherDesc = '';
        }
      } catch (e) {
        // 天气获取失败不影响位置显示
        console.warn('Weather fetch failed (non-critical):', e.message);
      }
    }

    this._cache = {
      location: displayCity,
      weather: weatherDesc,
      city: userCity,
      source,
      hasGeo: !!geo
    };
    this._ts = now;
    if (Store.data) {
      Store.data.settings = {
        ...Store.data.settings,
        location: this._cache.location,
        weather: this._cache.weather,
        locationSource: source
      };
      Store.save();
    }
    return this._cache;
  },

  // Always translate weather on read - even cache may have old English
  getDisplayWeather() {
    if (this.isDisabled()) {
      return { location: '', weather: '', disabled: true };
    }
    const cached = this._cache || { weather: '', location: '' };
    return {
      ...cached,
      weather: translateWeather(cached.weather) || '',
      location: cached.location || ''
    };
  },

  async refresh() {
    const result = await this.fetch(true);
    App.render();
    return result;
  },

  // Force re-acquire geolocation
  async refreshGeolocation() {
    await this.getGeolocation(true);
    this._ts = 0;
    return await this.refresh();
  }
};


const App = {

  setDate(d) {
