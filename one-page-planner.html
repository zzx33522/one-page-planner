    this.render();
  },

  // Render the sidebar list of important days
  renderImportantSidebar() {
    const list = document.getElementById('sidebar-list');
    if (!list) return;
    const days = Store.getImportantDays().slice();
    if (days.length === 0) {
      list.innerHTML = '<div class="sidebar-empty">暂无重要日子<br>点击 + 添加</div>';
      return;
    }
    days.sort((a, b) => {
      if (a.type === 'lunar' && b.type === 'lunar') return (a.month - b.month) || (a.day - b.day);
      if (a.type === 'lunar') return 1;
      if (b.type === 'lunar') return -1;
      // solar: recurring uses month+day; one-time uses date
      const aKey = a.recurring ? a.month * 100 + a.day : (a.date || '');
      const bKey = b.recurring ? b.month * 100 + b.day : (b.date || '');
      return aKey < bKey ? -1 : aKey > bKey ? 1 : 0;
    });
    list.innerHTML = days.map(d => {
      let dateLabel;
      if (d.type === 'lunar') {
        dateLabel = '🌙 ' + LUNAR_MONTH_NAMES[d.month-1] + '月' + LUNAR_DAY_NAMES[d.day-1] + ' · 每年';
      } else if (d.recurring) {
        dateLabel = '📅 ' + d.month + '月' + d.day + '日 · 每年';
      } else {
        dateLabel = '📅 ' + (d.date || '') + ' · 一次性';
      }
      return `
        <div class="sidebar-item" data-id="${d.id}">
          <div class="sidebar-item-info">
            <div class="sidebar-item-title">${escapeHTML(d.title)}</div>
            <div class="sidebar-item-date">${escapeHTML(dateLabel)}</div>
          </div>
          <button class="sidebar-item-delete" data-id="${d.id}" title="删除">${ICONS.trash}</button>
        </div>`;
    }).join('');
    list.querySelectorAll('.sidebar-item-delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm('确定删除"' + btn.closest('.sidebar-item').querySelector('.sidebar-item-title').textContent + '"吗？')) {
          Store.removeImportantDay(btn.dataset.id);
          this.renderImportantSidebar();
          if (this.currentView === 'day') DayView.render(this.currentDate);
        }
      });
    });
  },

  render() {
    const dd = document.getElementById('date-display');
    switch (this.currentView) {
      case 'day':   dd.textContent = DateUtil.formatDateLong(this.currentDate); break;
      case 'week': {
        const start = DateUtil.startOfWeek(this.currentDate);
        const end = DateUtil.addDays(start, 6);
        dd.textContent = `${DateUtil.formatDateShort(start)} → ${DateUtil.formatDateShort(end)}`;
        break;
      }
      case 'month': dd.textContent = DateUtil.formatMonthYear(this.currentDate); break;
      case 'year':  dd.textContent = DateUtil.formatYear(this.currentDate); break;
    }

    switch (this.currentView) {
      case 'day':   DayView.render(this.currentDate); break;
      case 'week':  WeekView.render(this.currentDate); break;
      case 'month': MonthView.render(this.currentDate); break;
      case 'year':  YearView.render(this.currentDate); break;
    }
  },

  // ---- 任务六: 导出 / 导入 / 查看 ----

  // 导出: 将 Store.data 序列化为 JSON 并下载
  exportData() {
    try {
      const data = Store.data || { cells: {}, importantDays: [], settings: {} };
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date();
      const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
      a.href = url;
      a.download = `one-page-planner-${ymd}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('导出失败：' + e.message);
    }
  },

  // 导入: 校验 JSON 格式后覆盖当前数据
  importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed || typeof parsed !== 'object') throw new Error('文件内容不是有效对象');
        if (!('cells' in parsed) || !('importantDays' in parsed) || !('settings' in parsed)) {
          throw new Error('文件缺少必要字段 (cells / importantDays / settings)');
        }
        const days = Object.keys(parsed.cells || {}).length;
        const importantCount = (parsed.importantDays || []).length;
        const ok = confirm(`导入将覆盖当前数据，是否继续？\n\n数据预览：${days} 天数据 / ${importantCount} 个重要日子`);
        if (!ok) return;
        Store.data = parsed;
        if (!Store.data.cells) Store.data.cells = {};
        // 数据迁移兼容 (旧格式 → 多页)
        for (const dateStr in Store.data.cells) {
          const day = Store.data.cells[dateStr];
          if (day && !day.pages && typeof day === 'object') {
            Store.data.cells[dateStr] = { pages: [day] };
          }
        }
        if (!Store.data.importantDays) Store.data.importantDays = [];
        if (!Store.data.settings) Store.data.settings = {};
        Store.save();
        this.render();
        this.renderImportantSidebar();
        alert('导入成功');
      } catch (err) {
        alert('导入失败：' + err.message);
      }
    };
    reader.onerror = () => alert('读取文件失败');
    reader.readAsText(file);
  },

  // 查看: 只读展示当前数据结构
  async viewData() {
    try {
      const data = Store.data || { cells: {}, importantDays: [], settings: {} };
      const days = Object.keys(data.cells || {}).length;
      const importantCount = (data.importantDays || []).length;
      const json = JSON.stringify(data, null, 2);
      const rawBytes = new Blob([json]).size;
      const rawKB = (rawBytes / 1024).toFixed(2);
      const totalMB = 5;
      const totalBytes = totalMB * 1024 * 1024;
      const pct = ((rawBytes / totalBytes) * 100).toFixed(2);

      // 任务七: 估算 gzip 压缩后大小与预计可用年限
      let compressedKB = rawKB;
      let ratioText = '—';
      try {
        const compressed = await compressJSON(JSON.stringify(data));
        const compressedBytes = new Blob([compressed]).size;
        compressedKB = (compressedBytes / 1024).toFixed(2);
        ratioText = rawBytes > 0 ? Math.round((compressedBytes / rawBytes) * 100) + '%' : '—';
      } catch (e) {}

      let yearsText = '—';
      if (days > 0 && rawBytes > 0) {
        const dailyBytes = rawBytes / days;
        const remainingBytes = totalBytes - rawBytes;
        const remainingYears = remainingBytes / dailyBytes / 365;
        yearsText = remainingYears > 0 ? remainingYears.toFixed(1) + ' 年' : '已接近上限';
      }

      const summary = document.getElementById('data-view-summary');
      const jsonEl = document.getElementById('data-view-json');
      if (summary) {
        summary.innerHTML = `
          <div>数据日期数：${days} 天</div>
          <div>重要日子数：${importantCount} 个</div>
          <div>原始 JSON 大小：${rawKB} KB</div>
          <div>gzip 压缩后：${compressedKB} KB（压缩率 ${ratioText}）</div>
          <div>已用容量：${pct}% / ${totalMB} MB</div>
          <div>预计可用年限：约 ${yearsText}</div>
        `;
      }
      if (jsonEl) jsonEl.textContent = json;
      document.getElementById('data-view-modal').classList.remove('hidden');
    } catch (e) {
      alert('查看失败：' + e.message);
    }
  },

  // 任务七: 归档 N 年前数据 (导出下载后从热数据移除)
  archiveData(years = 1) {
    const threshold = new Date();
    threshold.setFullYear(threshold.getFullYear() - years);
    const thresholdStr = DateUtil.toKey(threshold);
    const archived = { cells: {}, importantDays: [], settings: Store.data.settings || {} };
    const keptCells = {};
    for (const dateStr in (Store.data.cells || {})) {
      if (dateStr < thresholdStr) {
        archived.cells[dateStr] = Store.data.cells[dateStr];
      } else {
        keptCells[dateStr] = Store.data.cells[dateStr];
      }
    }
    const count = Object.keys(archived.cells).length;
    if (count === 0) {
      alert('没有 ' + years + ' 年前的可归档数据');
      return;
    }
    const ok = confirm(`将归档 ${count} 天数据（${years} 年前）。\n归档数据会导出下载并从当前数据移除，是否继续？`);
    if (!ok) return;
    const json = JSON.stringify(archived, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    a.href = url;
    a.download = `one-page-planner-archive-${years}y-${count}days.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    Store.data.cells = keptCells;
    Store.save();
    this.render();
    this.viewData();
  },

  // 任务七: 启动时检查存储占用, 超过阈值给出提示
  checkStorageUsage() {
    try {
      const data = Store.data || { cells: {}, importantDays: [], settings: {} };
      const json = JSON.stringify(data);
      const sizeBytes = new Blob([json]).size;
      const pct = sizeBytes / (5 * 1024 * 1024);
      if (pct > 0.8) {
        console.warn('[storage] 已用 ' + (pct * 100).toFixed(1) + '%，建议归档/导出');
        const list = document.getElementById('sidebar-list');
        if (list) {
          const warning = document.createElement('div');
          warning.className = 'storage-warning';
          warning.textContent = '⚠ 存储将满，建议归档/导出';
          list.prepend(warning);
        }
      }
    } catch (e) {}
  },

  // 关闭数据查看弹窗
  closeDataView() {
    document.getElementById('data-view-modal').classList.add('hidden');
  },

  openImportantModal() {
    document.getElementById('important-modal').classList.remove('hidden');
    // Reset to solar tab
    document.querySelectorAll('.type-tab').forEach(t => t.classList.toggle('active', t.dataset.type === 'solar'));
    document.getElementById('add-fields-solar').classList.remove('hidden');
    document.getElementById('add-fields-lunar').classList.add('hidden');
    // Pre-fill the date input with the currently displayed date
    const dateInput = document.getElementById('new-day-date');
    if (dateInput && !dateInput.value) {
      dateInput.value = DateUtil.formatDateShort(this.currentDate);
    }
    this.renderImportantList();
    this.renderImportantSidebar();
  },

  closeImportantModal() {
    document.getElementById('important-modal').classList.add('hidden');
    if (this.currentView === 'day') DayView.render(this.currentDate);
  },

  renderImportantList() {
    const list = document.getElementById('important-list');
    const days = Store.getImportantDays().slice();
    if (days.length === 0) {
      list.innerHTML = '<div style="color:var(--text-muted);font-style:italic;font-size:13px;text-align:center;padding:30px 0;">还没有重要日子<br>在下方添加你的第一个吧</div>';
      return;
    }
    days.sort((a, b) => {
      if (a.type === 'lunar' && b.type === 'lunar') {
        return (a.month - b.month) || (a.day - b.day);
      }
      if (a.type === 'lunar') return 1;
      if (b.type === 'lunar') return -1;
      return (a.date || '').localeCompare(b.date || '');
    });
    const wrapper = document.createElement('div');
    wrapper.innerHTML = `
      <div class="important-list-header">
        <h4>已添加的重要日子</h4>
        <span class="count">${days.length} 项</span>
      </div>
      <div class="important-day-items">
        ${days.map(d => {
          let dateLabel;
          if (d.type === 'lunar') {
            const prefix = d.isLeap ? '🌙 闰' : '🌙 ';
            dateLabel = prefix + LUNAR_MONTH_NAMES[d.month-1] + '月' + LUNAR_DAY_NAMES[d.day-1] + ' · 每年';
   

       } else if (d.recurring) {
            dateLabel = '📅 ' + d.month + '月' + d.day + '日 · 每年';
          } else {
            dateLabel = '📅 ' + (d.date || '') + ' · 一次性';
          }
          return `
            <div class="important-day-item ${d.type === 'lunar' ? 'is-lunar' : ''}">
              <span class="star">${ICONS.star}</span>
              <div class="important-day-text">
                <div class="important-day-title">${escapeHTML(d.title)}</div>
                <div class="important-day-date">${escapeHTML(dateLabel)}</div>
              </div>
              <button class="important-day-remove" data-id="${d.id}" title="删除">${ICONS.trash}</button>
            </div>
          `;
        }).join('')}
      </div>
    `;
    list.innerHTML = '';
    list.appendChild(wrapper);

    list.querySelectorAll('.important-day-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        Store.removeImportantDay(btn.dataset.id);
        this.renderImportantList();
      });
    });
  },
};


/* =====================================================================
 *  LUNAR SELF-TESTS  —  启动时跑一次，校验 LUNAR_INFO 是否被误改
 *  失败会在 console 打印 [lunar] assertion failed: ...
 * ===================================================================== */
(function selfTestLunar(){
  function _date(y,m,d){return {y,m,d};}
  function _cmp(label, got, exp){
    const ok = got && got.getUTCFullYear()===exp.y && got.getUTCMonth()+1===exp.m && got.getUTCDate()===exp.d;
    console.assert(ok, '[lunar] '+label+' got='+got+' want='+exp.y+'-'+exp.m+'-'+exp.d);
    return ok;
  }
  const checks = [
    ['2026 农历八月廿8 → 2026-10-08', lunarToSolar(2026,8,28,false), _date(2026,10,8)],
    ['2025 五月初五 (端午) → 2025-05-31', lunarToSolar(2025,5,5,false), _date(2025,5,31)],
    ['2025 八月十五 (中秋) → 2025-10-06', lunarToSolar(2025,8,15,false), _date(2025,10,6)],
    ['2025 春节 → 2025-01-29', lunarToSolar(2025,1,1,false), _date(2025,1,29)],
    ['2026 春节 → 2026-02-17', lunarToSolar(2026,1,1,false), _date(2026,2,17)],
    ['2025 闰六月十五 → 2025-08-08', lunarToSolar(2025,6,15,true), _date(2025,8,8)],
    ['2024 龙抬头 二月初二 → 2024-03-11', lunarToSolar(2024,2,2,false), _date(2024,3,11)],
    ['2026 中秋 八月十五 → 2026-09-25', lunarToSolar(2026,8,15,false), _date(2026,9,25)],
    ['1900 春节 (基线) → 1900-01-31', lunarToSolar(1900,1,1,false), _date(1900,1,31)],
  ];
  let pass = 0;
  for(const [l,got,exp] of checks){ if(_cmp(l,got,exp)) pass++; }
  // 反向互逆: lunar → solar → lunar 应回到原值
  const s = lunarToSolar(2026,8,28,false);
  const back = solarToLunar(s);
  const invOk = back && back.year===2026 && back.month===8 && back.day===28 && !back.isLeap;
  console.assert(invOk, '[lunar] solarToLunar 反推不匹配: '+JSON.stringify(back));
  if(invOk) pass++;
  console.log('[lunar] self-tests: '+pass+'/'+(checks.length+1)+' 通过');
})();

/* =====================================================================

  // 验证 COLUMN_OF / COLUMN_TYPE_OF / ROW_OF

  t('work(idx 1) > flex(idx 2)', itemImportance(1) > itemImportance(2));
  t('flex(idx 2) > personal(idx 3)', itemImportance(2) > itemImportance(3));
  // 同列 work (col 1): row 0 > row 1 > row 2 > row 3
  t('同列 work: row0(idx 1) > row1(idx 5)', itemImportance(1) > itemImportance(5));
  t('同列 work: row1(idx 5) > row2(idx 9)', itemImportance(5) > itemImportance(9));
  t('同列 work: row2(idx 9) > row3(idx 13)', itemImportance(9) > itemImportance(13));

  // 验证 getDayItemsSorted
  // 构造测试数据: 一个日期, 所有 15 个格子都有内容
  const testDate = '2099-12-31';
  Store.data = { cells: {}, importantDays: [], settings: { city:'', weather:'', location:'', locationSource:'manual', geo:null, weatherDisabled:false } };
  Store.data.cells[testDate] = { pages: [{}] };

    Store.data.cells[testDate].pages[0][i] = { content: 'cell-'+i, status: 'active' };
  }
  const sorted = Store.getDayItemsSorted(testDate);
  t('getDayItemsSorted 返回 15 项', sorted.length === 15);
  t('最优先是 work row 0 (idx 1)', sorted[0].index === 1);
  // top 4 应是: work col 0/1 row 0 (idx 1, 4)
  t('top 2 含 idx 4 (work col 0 row 1)', sorted.slice(0, 4).some(x => x.index === 4));
  // 末位应是 personal row 3 (idx 15)
  t('末位是 idx 15 (personal row 3)', sorted[sorted.length-1].index === 15);

  // 跨页
  Store.data.cells[testDate].pages[1] = {};

  const sorted2 = Store.getDayItemsSorted(testDate);
  t('跨页: getDayItemsSorted 返回 16 项', sorted2.length === 16);
  t('跨页: 最高仍是 idx 1', sorted2[0].index === 1);
  t('跨页: 含 page2-cell1 (idx 1, pageIdx 1)', sorted2.some(x => x.pageIdx === 1 && x.index === 1));

  // getDayPreviews 基于排序
  Store.data.cells[testDate] = { pages: [{}] };
  for(let i=1; i<=15; i++){
    Store.data.cells[testDate].pages[0][i] = { content: 'cell-'+i, status: 'active' };
  }
  const previews = Store.getDayPreviews(testDate, 3);
  t('getDayPreviews 返回 3 条', previews.length === 3);
  t('getDayPreviews 第一条 = work row 0', previews[0] === 'cell-1');

  console.log('[task3] self-tests: '+pass+'/'+total+' 通过');
